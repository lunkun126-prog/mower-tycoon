<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2aa7ef">
<title>割草大亨</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <button id="btnSet" class="set-btn" aria-label="设置">⚙</button>
  <div class="top-right">
    <div class="counters">
      <div class="cnt"><i class="gem-ico big"></i><b id="gems">0</b></div>
      <div class="cnt"><i class="coin-ico big">$</i><b id="coins">0</b></div>
    </div>
    <div class="prog">
      <span id="lvlName">第 1 关</span>
      <div class="pwrap"><div id="progBar" class="pbar"><i id="progFill"></i></div><div id="progRewards" class="prewards"></div></div>
    </div>
    <div id="boost" class="boost" hidden>⚡ 助推中 <b id="boostT">5:00</b></div>
  </div>
  <div class="cap">
    <div class="pot"><span></span></div>
    <div class="capbar"><i id="capFill"></i><span id="capText">0 / 360</span></div>
  </div>
  <div id="hint" class="hint" hidden>按住屏幕滑动<br>操控割草机</div>
  <div id="toast" class="toast"></div>
  <div id="joy" class="joy" hidden><i></i></div>
</div>

<div id="modal" class="modal" hidden></div>
<div id="loading" class="loading"><h1>割草大亨</h1><p>正在准备草场…</p></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
